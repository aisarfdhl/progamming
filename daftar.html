<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <label>Nama siwa :</label> 
   <input type="text" id="namasiswa"><br><br>

   <label">kelas:</label> 
   <input type="text" id="kelas"><br><br>

   <p id="Namasiswa"></p>
   <p id="Kelas"></p>

    <button onclick="Submit()">Submit</button>
    <script>
       function Submit(){
        let Namasiswa = ambilData("namasiswa")
        let Kelas = ambilData("kelas")
        tampilData("Namasiswa",Namasiswa)
        tampilData("Kelas",Kelas)
       }
       function ambilData(id){
        let ambildata = document.getElementById(id).value
        return ambildata
    }
        function tampilData(id,isi){
            let tampildata = document.getElementById(id).innerHTML = id+' : '+isi;
        }
    </script>

</body>
